{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - IBM HR</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
    <div class="login-card auth-card">
        <h1>Password Reset Complete</h1>
        <div class="alert alert-success">
            Your password has been set. You can now log in with your new password.
        </div>
        <a href="{% url 'login' %}" class="btn btn-primary" style="width:100%;display:block;text-align:center;">Go to Login</a>
    </div>
</div>
</body>
</html>
